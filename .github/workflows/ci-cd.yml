name: Django + TypeScript CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: testdb
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -prootpass"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: polygames.settings
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: testdb
      DB_USER: testuser
      DB_PASSWORD: testpass
      SECRET_KEY: testsecretkey
      DEBUG: "True"

    steps:
      - name: Клонировать репозиторий
        uses: actions/checkout@v3

      # Установка Python и зависимости
      - name: Установить Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Установить зависимости Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django mysqlclient

      # Установка Node.js для фронтенда
      - name: Установить Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Установить зависимости фронтенда
        working-directory: ./frontend
        run: npm install

      - name: Собрать фронтенд (TypeScript)
        working-directory: ./frontend
        run: npm run build

      # Подождать MySQL и применить миграции
      - name: Подождать MySQL
        run: |
          until mysqladmin ping -h 127.0.0.1 -uroot -prootpass --silent; do
            echo "Ожидаем доступность MySQL..."
            sleep 2
          done

      - name: Применить миграции Django
        run: python manage.py migrate

      - name: Запустить тесты
        run: pytest -v

  docker:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Клонировать репозиторий
        uses: actions/checkout@v3

      - name: Логин в Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Сборка Docker-образа
        run: docker build -t myuser/myapp:latest .

      - name: Публикация Docker-образа
        run: docker push myuser/myapp:latest
